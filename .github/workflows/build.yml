name: Tests et installeurs

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Tests du modèle
        run: npm test
      - name: Test automatique de l'interface (rendu par défaut de la machine)
        run: xvfb-run --auto-servernum npm run selftest
      - name: Test automatique de l'interface (WebGL logiciel, shader deux couleurs)
        env:
          WN2D_ELECTRON_ARGS: --ignore-gpu-blocklist --enable-unsafe-swiftshader
        run: xvfb-run --auto-servernum node scripts/selftest.mjs selftest-output-webgl
      - name: Captures du test automatique
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-selftest
          path: |
            selftest-output/
            selftest-output-webgl/

  runtime-godot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Installer Godot (sans fenêtre)
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
      - name: Comparer le runtime Godot à l'éditeur
        run: node scripts/godot-check.mjs "$PWD/Godot_v4.4.1-stable_linux.x86_64"

  installeurs:
    needs: [tests, runtime-godot]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            commande: dist:linux
            fichiers: |
              release/*.AppImage
              release/*.deb
          - os: windows-latest
            commande: dist:win
            fichiers: |
              release/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.commande }}
      - uses: actions/upload-artifact@v4
        with:
          name: installeurs-${{ matrix.os }}
          path: ${{ matrix.fichiers }}
          if-no-files-found: error

  publication:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: installeurs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installeurs
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: installeurs/*
          generate_release_notes: true
